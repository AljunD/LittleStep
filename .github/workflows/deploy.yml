# Tests the backend on every pull request and push to main; deploys the teacher portal to Wasmer Edge
# (https://littlestep.wasmer.app) after a push to main, only when the tests pass.
# Needs the repository secret WASMER_TOKEN (wasmer.io → Settings → Access tokens).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, gd, intl, zip, bcmath, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Build assets (the views need the Vite manifest)
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to Wasmer Edge
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://littlestep.wasmer.app
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, gd, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install the Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Build, deploy and update the database
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "::error::Add the WASMER_TOKEN repository secret (wasmer.io → Settings → Access tokens)."
            exit 1
          fi
          bash backend/deploy/wasmer/build.sh --deploy
