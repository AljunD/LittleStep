; PHP settings for LittleStep on Wasmer Edge (loaded through PHPRC=/config/ in wasmer.toml).
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 5M
post_max_size = 8M
; "E" makes environment variables (app.yaml env, secrets, DB_*) visible in $_ENV for Laravel.
variables_order = "EGPCS"
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
