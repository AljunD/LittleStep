[package]
name = "aljund/littlestep"
version = "0.1.0"
description = "LittleStep teacher portal and guardian API (Laravel)"
private = true

[dependencies]
"php/php" = "=8.3.403"

[fs]
"/app" = "."
"/config" = "php-config"

# The web server (Wasmer Edge serves port 8080).
[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
env = ["PHPRC=/config/"]

# `php artisan ...`, used by the jobs in app.yaml.
[[command]]
name = "artisan"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/artisan"]
env = ["PHPRC=/config/"]

# Plain `php`, used to create the storage folders on the volume.
[[command]]
name = "php"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
env = ["PHPRC=/config/"]
